<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="現場管理">
<meta name="theme-color" content="#1E293B">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="./assets/icon-512.png">
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<title>彩心堂 現場管理</title>
<style>
/* ═══ RESET & BASE ═══ */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#F1F3F9;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Meiryo","Noto Sans JP",sans-serif;color:#1A2240;font-size:15px;-webkit-text-size-adjust:100%;overscroll-behavior:none}
input,textarea,button,select{font-family:inherit;font-size:16px}
input::placeholder,textarea::placeholder{color:#A0AAC0}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:0}

/* ═══ LAYOUT ═══ */
.app{min-height:100vh;display:flex;flex-direction:column}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.view.hidden{display:none}
.top-header{background:#1E293B;color:#fff;padding:calc(env(safe-area-inset-top,20px) + 8px) 20px 14px;position:sticky;top:0;z-index:50}
.top-header h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-.3px}
.top-header .sub{font-size:12px;color:#94A3B8;font-weight:500}
.container{max-width:540px;margin:0 auto;padding:14px 16px 24px}

/* ═══ BOTTOM TAB BAR ═══ */
.tab-bar-bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #E2E8F0;display:grid;grid-template-columns:1fr 1fr 1fr;z-index:100;padding-bottom:env(safe-area-inset-bottom,0px)}
.tab-bar-bottom button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 6px;font-size:10px;font-weight:600;color:#94A3B8;transition:color .15s}
.tab-bar-bottom button.active{color:#4F46E5}
.tab-bar-bottom button svg{width:22px;height:22px}

/* ═══ CARDS ═══ */
.card{background:#fff;border-radius:16px;border:1px solid #E8EAF2;box-shadow:0 1px 3px rgba(20,30,80,.04);overflow:hidden;margin-bottom:14px}
.card-hd{padding:14px 18px;border-bottom:1px solid #F0F2F8;display:flex;align-items:center;justify-content:space-between;min-height:48px}
.card-hd .title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px;color:#3B4563}

/* ═══ BUTTONS ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;font-weight:700;min-height:44px;padding:10px 20px;font-size:15px;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.96);opacity:.85}
.btn-primary{background:linear-gradient(135deg,#4F46E5,#6D28D9);color:#fff;box-shadow:0 2px 10px rgba(79,70,229,.25)}
.btn-outline{background:#fff;color:#4F46E5;border:1.5px solid #C7D2FE}
.btn-ghost{color:#64748B;padding:10px}
.btn-sm{min-height:36px;padding:8px 14px;font-size:13px;border-radius:10px}
.btn-success{background:#059669;color:#fff}
.btn-danger{background:#FEF2F2;color:#DC2626;border:1px solid #FEE2E2}

/* ═══ FIELDS ═══ */
.field{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid #E2E8F0;background:#F8FAFC;color:#1A2240;font-size:16px;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:#4F46E5;background:#fff;box-shadow:0 0 0 3px #EEF2FF;outline:none}
textarea.field{resize:none;line-height:1.5;min-height:52px}
.label{font-size:13px;color:#64748B;font-weight:600;margin-bottom:6px}

/* ═══ TODAY: MEMBER CARDS ═══ */
.member-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.m-card{border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .12s,box-shadow .12s;border:2px solid transparent;min-height:90px;position:relative}
.m-card:active{transform:scale(.95)}
.m-card .avatar{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff}
.m-card .name{font-size:13px;font-weight:700;color:#334155;text-align:center}
.m-card .status{font-size:14px;font-weight:800;letter-spacing:.3px}
/* Card states */
.m-card[data-st="present"]{background:#ECFDF5;border-color:#A7F3D0}
.m-card[data-st="present"] .status{color:#059669}
.m-card[data-st="half"]{background:#FFFBEB;border-color:#FDE68A}
.m-card[data-st="half"] .status{color:#D97706}
.m-card[data-st="absent"]{background:#FEF2F2;border-color:#FECACA}
.m-card[data-st="absent"] .status{color:#DC2626}
.m-card[data-st=""]{background:#F8FAFC;border-color:#E2E8F0}
.m-card[data-st=""] .status{color:#CBD5E1}

/* ═══ SUMMARY BAR ═══ */
.summary-bar{display:flex;align-items:center;justify-content:center;gap:20px;padding:12px;background:#F1F5F9;border-radius:12px;margin:10px 0}
.summary-bar .num{font-size:24px;font-weight:900;color:#4F46E5}
.summary-bar .lbl{font-size:11px;color:#94A3B8;font-weight:600}

/* ═══ FULLCALENDAR CUSTOMIZATION ═══ */
#fc-container{background:#fff;border-radius:16px;border:1px solid #E8EAF2;box-shadow:0 1px 3px rgba(20,30,80,.04);overflow:hidden;padding:8px}
#fc-container .fc{font-family:inherit;font-size:13px}
#fc-container .fc .fc-toolbar{margin-bottom:8px;padding:0 4px}
#fc-container .fc .fc-toolbar-title{font-size:18px;font-weight:800;color:#1A2240}
#fc-container .fc .fc-button{background:#4F46E5;border:none;border-radius:10px;font-size:13px;font-weight:600;padding:6px 14px;box-shadow:none;text-transform:none}
#fc-container .fc .fc-button:hover{background:#4338CA}
#fc-container .fc .fc-button-active{background:#3730A3}
#fc-container .fc .fc-button-group .fc-button{border-radius:10px;margin:0 2px}
#fc-container .fc .fc-today-button{background:rgba(79,70,229,.12);color:#4F46E5;font-weight:700}
#fc-container .fc .fc-today-button:hover{background:rgba(79,70,229,.2)}
#fc-container .fc .fc-today-button:disabled{opacity:.4}
#fc-container .fc .fc-prev-button,#fc-container .fc .fc-next-button{background:none;color:#64748B;padding:6px 8px}
#fc-container .fc .fc-prev-button:hover,#fc-container .fc .fc-next-button:hover{background:#F1F5F9;color:#1A2240}
#fc-container .fc .fc-daygrid-day{min-height:70px;cursor:pointer}
#fc-container .fc .fc-daygrid-day:active{background:#EEF2FF}
#fc-container .fc .fc-daygrid-day-number{font-size:13px;font-weight:700;color:#64748B;padding:4px 6px}
#fc-container .fc .fc-day-today{background:#EEF2FF !important}
#fc-container .fc .fc-day-today .fc-daygrid-day-number{background:#4F46E5;color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;padding:0}
#fc-container .fc .fc-day-sun .fc-daygrid-day-number{color:#DC2626}
#fc-container .fc .fc-day-sat .fc-daygrid-day-number{color:#2563EB}
#fc-container .fc .fc-daygrid-event{border-radius:4px;border:none;font-size:11px;font-weight:600;padding:1px 6px;margin:1px 2px}
#fc-container .fc .fc-daygrid-dot-event{padding:2px 4px}
#fc-container .fc .fc-col-header-cell{font-size:12px;font-weight:600;color:#94A3B8;padding:8px 0;border-bottom:1px solid #E8EAF2}
#fc-container .fc .fc-col-header-cell.fc-day-sun{color:#DC2626}
#fc-container .fc .fc-col-header-cell.fc-day-sat{color:#2563EB}
#fc-container .fc .fc-scrollgrid{border:none}
#fc-container .fc td,#fc-container .fc th{border-color:#F0F2F8}
#fc-container .fc .fc-daygrid-day-bottom{padding:2px 4px}
.fc-ninku-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:800;line-height:1}
.fc-ninku-actual{background:#DC2626;color:#fff}
.fc-ninku-plan{background:none;color:#2563EB;font-weight:800;font-size:11px}
.fc-memo-dot{width:5px;height:5px;border-radius:50%;background:#D97706;display:inline-block;margin-left:2px;vertical-align:middle}

/* ═══ DAY DETAIL PANEL ═══ */
.day-panel-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.day-panel-bg.hidden{display:none!important}
.day-panel{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:540px;padding:8px 20px calc(env(safe-area-inset-bottom,0px) + 24px);max-height:80vh;overflow-y:auto;animation:slideUp .25s ease}
.day-panel .dp-handle{width:36px;height:5px;border-radius:3px;background:#E2E8F0;margin:0 auto 12px}
.day-panel .dp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.day-panel .dp-title{font-size:18px;font-weight:800;color:#1A2240}
.day-panel .dp-nav{display:flex;gap:8px}
.day-panel .dp-tabs{display:flex;gap:4px;margin-bottom:14px;background:#F1F5F9;border-radius:10px;padding:3px}
.day-panel .dp-tab{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:14px;font-weight:700;color:#64748B;cursor:pointer;border:none;background:none}
.day-panel .dp-tab.active{background:#fff;color:#4F46E5;box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ═══ MODAL ═══ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-bg.hidden{display:none!important}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:8px 20px calc(env(safe-area-inset-bottom,0px) + 24px);max-height:85vh;overflow-y:auto}
.modal-handle{width:36px;height:5px;border-radius:3px;background:#E2E8F0;margin:0 auto 16px}
.color-dot{width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.color-dot:active{transform:scale(.9)}

/* ═══ SITE CARD (Dashboard) ═══ */
.site-card{background:#fff;border-radius:16px;border:1px solid #E8EAF2;box-shadow:0 1px 3px rgba(20,30,80,.04);overflow:hidden;margin-bottom:14px}
.site-card-hd{padding:14px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;cursor:pointer}
.site-card-hd h3{font-size:16px;font-weight:800;margin:0;color:#1A2240}
.site-card-ev{margin:0 16px 8px;display:flex;gap:6px;flex-wrap:wrap}
.site-card-ev span{font-size:11px;font-weight:600;color:#fff;padding:3px 10px;border-radius:6px}
.site-card-members{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.site-card-members .mc{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;cursor:pointer;min-height:40px;border:1.5px solid transparent;transition:all .12s}
.site-card-members .mc:active{transform:scale(.95)}
.site-card-members .mc .av{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.site-card-members .mc .st{font-size:12px;font-weight:700}
.mc[data-s="present"]{background:#ECFDF5;border-color:#A7F3D0}.mc[data-s="present"] .st{color:#059669}
.mc[data-s="half"]{background:#FFFBEB;border-color:#FDE68A}.mc[data-s="half"] .st{color:#D97706}
.mc[data-s="absent"]{background:#FEF2F2;border-color:#FECACA}.mc[data-s="absent"] .st{color:#DC2626}
.mc[data-s=""]{background:#F8FAFC;border-color:#E2E8F0}.mc[data-s=""] .st{color:#CBD5E1}
.site-card-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid #F0F2F8;background:#FAFBFF}
.site-card-foot .nk{font-size:18px;font-weight:900;color:#4F46E5}
.site-card-foot .nk-label{font-size:11px;color:#94A3B8;font-weight:600}
.site-card-memo{padding:8px 16px 12px}
.site-card-memo textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid #E2E8F0;background:#F8FAFC;font-size:14px;resize:none;min-height:40px;line-height:1.4}
.site-card-memo textarea:focus{border-color:#4F46E5;background:#fff;box-shadow:0 0 0 3px #EEF2FF;outline:none}

/* ═══ DATE TOGGLE ═══ */
.date-toggle{display:inline-flex;gap:2px;background:#1E293B;border-radius:8px;padding:2px;margin-top:6px}
.date-toggle button{padding:5px 14px;border-radius:6px;font-size:12px;font-weight:700;color:rgba(255,255,255,.5);border:none;background:none;cursor:pointer}
.date-toggle button.active{background:rgba(255,255,255,.15);color:#fff}

/* ═══ ANIMATIONS ═══ */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.fade-in{animation:fadeIn .25s ease both}
.slide-up{animation:slideUp .25s cubic-bezier(.16,1,.3,1)}

/* ═══ WORKER LIST (settings) ═══ */
.w-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #F0F2F8;min-height:52px}
.w-row:last-child{border-bottom:none}
.w-row .av{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0}
.star-btn{padding:10px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="app">

<!-- ═══ TAB 1: HOME (Dashboard) ═══ -->
<div id="view-today" class="view">
  <div class="top-header">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <h1>彩心堂</h1>
        <div class="sub" id="home-date"></div>
        <div class="date-toggle">
          <button class="active" onclick="setDashDate(0)">今日</button>
          <button onclick="setDashDate(1)">明日</button>
        </div>
      </div>
      <button class="btn btn-sm btn-primary" onclick="addSite()" style="font-size:13px;min-height:36px;padding:8px 14px">+ 新規現場</button>
    </div>
  </div>
  <div class="container" id="home-container"></div>
</div>

<!-- ═══ TAB 2: CALENDAR ═══ -->
<div id="view-calendar" class="view hidden">
  <div class="top-header">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <h1 id="cal-title" style="cursor:pointer" onclick="showSiteSwitch()">カレンダー <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24" style="vertical-align:middle;opacity:.6"><polyline points="6,9 12,15 18,9"/></svg></h1>
        <div class="sub" id="cal-sub"></div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm" style="background:rgba(255,255,255,.12);color:#fff" onclick="exportPDF()">PDF</button>
        <button class="btn btn-sm" style="background:rgba(255,255,255,.12);color:#fff" onclick="exportCSV()">CSV</button>
        <button class="btn btn-sm" style="background:rgba(255,255,255,.12);color:#fff" onclick="showEventModal()">+ 工程</button>
      </div>
    </div>
  </div>
  <div class="container">
    <div id="fc-container"></div>
    <div id="cal-events" class="card" style="margin-top:14px">
      <div class="card-hd">
        <span class="title">工程一覧</span>
        <button class="btn btn-sm btn-primary" onclick="showEventModal()">+ 追加</button>
      </div>
      <div id="cal-event-list"></div>
    </div>
  </div>
</div>

<!-- ═══ DAY DETAIL PANEL ═══ -->
<div id="day-panel-bg" class="day-panel-bg hidden">
  <div class="day-panel">
    <div class="dp-handle"></div>
    <div class="dp-header">
      <div class="dp-title" id="dp-title"></div>
      <div class="dp-nav">
        <button class="btn btn-ghost btn-sm" onclick="dpPrev()"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg></button>
        <button class="btn btn-ghost btn-sm" onclick="dpNext()"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><polyline points="9,18 15,12 9,6"/></svg></button>
      </div>
    </div>
    <div class="dp-tabs">
      <button class="dp-tab active" onclick="dpSwitchTab('actual',this)">実績</button>
      <button class="dp-tab" onclick="dpSwitchTab('plan',this)">予定</button>
    </div>
    <div id="dp-content"></div>
  </div>
</div>

<!-- ═══ TAB 3: SETTINGS ═══ -->
<div id="view-settings" class="view hidden">
  <div class="top-header">
    <h1>設定</h1>
  </div>
  <div class="container">
    <div class="card">
      <div class="card-hd"><span class="title">現場情報</span><button class="btn btn-sm btn-outline" id="edit-toggle" onclick="toggleSiteEdit()">編集</button></div>
      <div id="site-form" style="padding:16px"></div>
    </div>
    <div class="card">
      <div class="card-hd"><span class="title">メンバー</span><button class="btn btn-sm btn-primary" onclick="showWorkerModal()">+ 追加</button></div>
      <div id="worker-list"></div>
    </div>
    <div class="card">
      <div class="card-hd"><span class="title">現場管理</span></div>
      <div style="padding:16px;display:flex;flex-direction:column;gap:10px">
        <button class="btn btn-outline" style="width:100%" onclick="addSite()">+ 新規現場を作成</button>
        <button class="btn btn-danger" style="width:100%" onclick="deleteSite()">この現場を削除</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ BOTTOM TAB BAR ═══ -->
<div class="tab-bar-bottom">
  <button id="tab-today" onclick="switchTab('today')" class="active">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
    ホーム
  </button>
  <button id="tab-calendar" onclick="switchTab('calendar')">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    カレンダー
  </button>
  <button id="tab-settings" onclick="switchTab('settings')">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    設定
  </button>
</div>

</div><!-- /app -->

<!-- ═══ WORKER MODAL ═══ -->
<div id="worker-modal" class="modal-bg hidden">
  <div class="modal-sheet slide-up">
    <div class="modal-handle"></div>
    <h3 id="wm-title" style="font-size:18px;font-weight:800;margin:0 0 16px">メンバーを追加</h3>
    <div class="label">名前</div>
    <input type="text" id="wm-name" class="field" placeholder="名前を入力" style="margin-bottom:14px">
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <div style="flex:1"><div class="label">アイコン文字</div><input type="text" id="wm-icon" class="field" placeholder="1文字" maxlength="2" style="text-align:center;font-weight:800"></div>
      <div style="flex:1"><div class="label">プレビュー</div><div id="wm-preview" style="height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;background:#4F46E5">?</div></div>

<!-- ═══════════════════════════════════════════════════════════
     JAVASCRIPT
     ═══════════════════════════════════════════════════════════ -->
<script>
// ─── Constants ───────────────────────────────────────────────
const WORKER_COLORS=["#4F46E5","#E11D48","#0D9488","#D97706","#2563EB","#DC2626","#7C3AED","#059669","#EA580C","#0891B2","#BE185D","#65A30D","#0284C7","#C026D3","#9333EA","#0E7490","#B91C1C","#047857","#6D28D9","#C2410C"];
const EVENT_COLORS=["#4F46E5","#0EA5E9","#10B981","#F59E0B","#EF4444","#8B5CF6"];
const DEFAULT_WORKERS=[
  {id:"saishindo-1",name:"髙嶋 宏",color:"#DC2626",icon:"宏",starred:true},
  {id:"saishindo-2",name:"髙嶋 隆一",color:"#7C3AED",icon:"隆",starred:true},
  {id:"saishindo-3",name:"髙嶋 昇",color:"#059669",icon:"昇",starred:true},
  {id:"saishindo-4",name:"佐久間 英二",color:"#D97706",icon:"佐",starred:true},
];
const DAY_JP=["日","月","火","水","木","金","土"];
const STATUS_CYCLE=["","present","half","absent"];
const STATUS_LABEL={"":"—",present:"出勤",half:"半日",absent:"欠勤"};

// ─── Helpers ─────────────────────────────────────────────────
function uid(){return Math.random().toString(36).substr(2,9)+Date.now().toString(36)}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function firstDow(y,m){return new Date(y,m,1).getDay()}
function dkey(y,m,d){return`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
function jpDay(y,m,d){return DAY_JP[new Date(y,m,d).getDay()]}
function workerIcon(w){return w.icon||w.name.charAt(0)}
function sortedWorkers(s){if(!s||!s.workers)return[];return[...s.workers].sort((a,b)=>(b.starred?1:0)-(a.starred?1:0))}
function eventsOnDate(s,ds){if(!s||!s.events)return[];return s.events.filter(e=>ds>=e.start&&ds<=e.end)}
function escHtml(s){if(s==null)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

// ─── Storage ─────────────────────────────────────────────────
function loadSites(){try{return JSON.parse(localStorage.getItem("genba_sites")||"[]")}catch(e){return[]}}
function saveSites(sites){localStorage.setItem("genba_sites",JSON.stringify(sites))}

// ─── Demo Data ───────────────────────────────────────────────
function initDemoData(){
  const sites=loadSites();
  if(sites.length>0){
    let m=false;
    sites.forEach(s=>{if(!s.events){s.events=[];m=true}if(s.generalContractor===undefined){s.generalContractor="";m=true}if(s.gcManager===undefined){s.gcManager="";m=true}(s.workers||[]).forEach(w=>{if(w.starred===undefined){w.starred=false;m=true}})});
    if(m)saveSites(sites);
    return;
  }
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const logs={};
  const pT=["LGS下地組み","ボード貼り","クロス下地処理","仕上げ塗装","建具吊り込み","タイル貼り","CF貼り","養生・清掃"];
  const mT=["壁下地ボード貼り","天井LGS組み","床CF貼り","クロス貼り","建具取付","タイル施工","塗装作業",""];
  for(let d=1;d<=Math.min(now.getDate(),daysInMonth(y,m));d++){
    const dow=new Date(y,m,d).getDay();if(dow===0||dow===6)continue;
    const k=dkey(y,m,d),ws={},pw={};
    ws["w1"]=Math.random()>.15?"present":"half";ws["w2"]=Math.random()>.2?"present":Math.random()>.5?"half":"absent";
    ws["w3"]=Math.random()>.1?"present":"half";ws["w4"]=d%3===0?"half":Math.random()>.25?"present":"";
    pw["w1"]="planned";pw["w2"]="planned";pw["w3"]="planned";if(d%3!==0)pw["w4"]="planned";
    logs[k]={workerStatus:ws,planWorkers:pw,memo:mT[d%mT.length],planMemo:pT[d%pT.length]};
    if(d%5===0)logs[k].plannedHeadcount=3;
  }
  const dim=daysInMonth(y,m);
  const events=[
    {id:uid(),title:"LGS下地組み",start:dkey(y,m,Math.min(3,dim)),end:dkey(y,m,Math.min(7,dim)),color:"#4F46E5"},
    {id:uid(),title:"ボード貼り",start:dkey(y,m,Math.min(8,dim)),end:dkey(y,m,Math.min(14,dim)),color:"#0EA5E9"},
    {id:uid(),title:"クロス・仕上げ",start:dkey(y,m,Math.min(15,dim)),end:dkey(y,m,Math.min(22,dim)),color:"#10B981"},
  ];
  saveSites([{id:"demo1",name:"渋谷パークレジデンス 内装工事",address:"東京都渋谷区神南1-2-3",generalContractor:"渋谷建設株式会社",gcManager:"山本 一郎",manager:"髙嶋 宏",phone:"090-1234-5678",notes:"3階〜5階のリノベーション工事",workers:[
    {id:"w1",name:"髙嶋 宏",color:"#DC2626",icon:"宏",starred:true},
    {id:"w2",name:"髙嶋 隆一",color:"#7C3AED",icon:"隆",starred:true},
    {id:"w3",name:"髙嶋 昇",color:"#059669",icon:"昇",starred:true},
    {id:"w4",name:"佐久間 英二",color:"#D97706",icon:"佐",starred:true},
  ],dayLogs:logs,events:events,createdAt:new Date().toISOString()}]);
}

// ─── App State ───────────────────────────────────────────────
let currentSiteId=null;
let currentTab="today";
let calYear=new Date().getFullYear();
let calMonth=new Date().getMonth();
let editingSiteMode=false;
let editingWorkerId=null;
let editingEventId=null;
let selectedWorkerColor=WORKER_COLORS[0];
let selectedEventColor=EVENT_COLORS[0];

function getSite(){return loadSites().find(s=>s.id===currentSiteId)||null}
function updateSite(fn){const sites=loadSites();const i=sites.findIndex(s=>s.id===currentSiteId);if(i>=0){fn(sites[i]);saveSites(sites)}}

// ─── Navigation ──────────────────────────────────────────────
function switchTab(t){
  currentTab=t;
  ["today","calendar","settings"].forEach(v=>{
    document.getElementById("view-"+v).classList.toggle("hidden",v!==t);
    document.getElementById("tab-"+v).classList.toggle("active",v===t);
  });
  if(t==="today")renderToday();
  else if(t==="calendar")renderCalendar();
  else if(t==="settings")renderSettings();
}

// ─── HOME SCREEN (Dashboard) ─────────────────────────────────
let dashDateOffset=0;

function setDashDate(offset){
  dashDateOffset=offset;
  document.querySelectorAll(".date-toggle button").forEach((b,i)=>b.classList.toggle("active",i===offset));
  renderToday();
}

function dashDate(){const n=new Date();n.setDate(n.getDate()+dashDateOffset);return n}
function todayKey(){const n=dashDate();return dkey(n.getFullYear(),n.getMonth(),n.getDate())}

function renderToday(){
  const sites=loadSites();
  const now=dashDate(),y=now.getFullYear(),m=now.getMonth(),d=now.getDate();
  const dk=todayKey();

  const label=dashDateOffset===0?"今日":"明日";
  document.getElementById("home-date").textContent=`${y}年${m+1}月${d}日（${jpDay(y,m,d)}）${dashDateOffset?` — ${label}`:""}`;

  const container=document.getElementById("home-container");

  if(sites.length===0){
    container.innerHTML=`<div style="text-align:center;padding:60px 20px">
      <div style="font-size:48px;margin-bottom:16px">🏗️</div>
      <h2 style="font-size:18px;font-weight:800;margin:0 0 8px">現場を追加しましょう</h2>
      <p style="color:#94A3B8;font-size:14px;margin:0 0 20px">右上の「+ 新規現場」ボタンから<br>最初の現場を登録してください</p>
    </div>`;
    return;
  }

  let html="";
  sites.forEach(s=>{
    const log=s.dayLogs?.[dk]||{};
    const workers=sortedWorkers(s);
    const evs=eventsOnDate(s,dk);

    // Calc today's ninku
    let nk=0,cnt=0;
    workers.forEach(w=>{const st=log.workerStatus?.[w.id]||"";if(st==="present"){nk+=1;cnt++}else if(st==="half"){nk+=0.5;cnt++}});
    const hasAny=workers.some(w=>{const st=log.workerStatus?.[w.id]||"";return st==="present"||st==="half"||st==="absent"});

    // Event bar
    const evHTML=evs.length>0?`<div class="site-card-ev">${evs.map(e=>`<span style="background:${e.color}">${escHtml(e.title)}</span>`).join("")}</div>`:"";

    // Member chips (inline attendance)
    let membersHTML="";
    if(workers.length>0){
      membersHTML=`<div class="site-card-members">${workers.map(w=>{
        const st=log.workerStatus?.[w.id]||"";
        return`<div class="mc" data-s="${st}" onclick="toggleSiteStatus('${s.id}','${w.id}')">
          <div class="av" style="background:${w.color}">${workerIcon(w)}</div>
          <span class="st">${STATUS_LABEL[st]}</span>
        </div>`;
      }).join("")}</div>`;
    } else {
      membersHTML=`<div style="padding:8px 16px"><button class="btn btn-outline btn-sm" style="width:100%" onclick="currentSiteId='${s.id}';switchTab('settings')">メンバーを追加</button></div>`;
    }

    // Footer with ninku + copy button
    const copyBtn=(!hasAny&&workers.length>0)?`<div style="display:flex;gap:4px">
      <button class="btn btn-outline btn-sm" onclick="copySiteYesterday('${s.id}')" style="font-size:11px;min-height:30px;padding:5px 8px">昨日と同じ</button>
      <button class="btn btn-outline btn-sm" onclick="copySiteLastWeek('${s.id}')" style="font-size:11px;min-height:30px;padding:5px 8px">先週同曜日</button>
    </div>`:"";

    // Memo
    const memo=log.memo||"";
    const memoHTML=`<div class="site-card-memo">
      <textarea placeholder="作業メモ..." oninput="saveSiteMemo('${s.id}',this.value)">${escHtml(memo)}</textarea>
    </div>`;

    html+=`<div class="site-card fade-in">
      <div class="site-card-hd" onclick="currentSiteId='${s.id}';switchTab('calendar')">
        <div>
          <h3>${escHtml(s.name||"新規現場")}</h3>
          ${s.generalContractor?`<div style="font-size:12px;color:#94A3B8;margin-top:2px">${escHtml(s.generalContractor)}</div>`:""}
        </div>
        <svg width="18" height="18" fill="none" stroke="#B0BAC8" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><polyline points="9,18 15,12 9,6"/></svg>
      </div>
      ${evHTML}
      ${membersHTML}
      <div class="site-card-foot">
        <div>
          <span class="nk">${nk}</span>
          <span class="nk-label"> 人工</span>
          ${cnt>0?`<span style="font-size:12px;color:#64748B;margin-left:8px">${cnt}名出勤</span>`:""}
        </div>
        ${copyBtn}
      </div>
      ${memoHTML}
    </div>`;
  });

  container.innerHTML=html;
}

function toggleSiteStatus(siteId,wId){
  const dk=todayKey();
  const sites=loadSites();
  const si=sites.findIndex(s=>s.id===siteId);
  if(si<0)return;
  const s=sites[si];
  if(!s.dayLogs[dk])s.dayLogs[dk]={};
  if(!s.dayLogs[dk].workerStatus)s.dayLogs[dk].workerStatus={};
  const cur=s.dayLogs[dk].workerStatus[wId]||"";
  s.dayLogs[dk].workerStatus[wId]=STATUS_CYCLE[(STATUS_CYCLE.indexOf(cur)+1)%STATUS_CYCLE.length];
  saveSites(sites);
  renderToday();
}

function copySiteYesterday(siteId){
  const now=dashDate();
  let prev=new Date(now);
  do{prev.setDate(prev.getDate()-1)}while(prev.getDay()===0||prev.getDay()===6);
  const pk=dkey(prev.getFullYear(),prev.getMonth(),prev.getDate());
  const dk=todayKey();
  const sites=loadSites();
  const si=sites.findIndex(s=>s.id===siteId);
  if(si<0)return;
  const s=sites[si];
  const prevLog=s.dayLogs?.[pk];
  if(!prevLog?.workerStatus){alert("昨日のデータがありません");return}
  if(!s.dayLogs[dk])s.dayLogs[dk]={};
  s.dayLogs[dk].workerStatus={...prevLog.workerStatus};
  saveSites(sites);
  renderToday();
}

function copySiteLastWeek(siteId){
  const now=dashDate();
  const prev=new Date(now);
  prev.setDate(prev.getDate()-7);
  const pk=dkey(prev.getFullYear(),prev.getMonth(),prev.getDate());
  const dk=todayKey();
  const sites=loadSites();
  const si=sites.findIndex(s=>s.id===siteId);
  if(si<0)return;
  const s=sites[si];
  const prevLog=s.dayLogs?.[pk];
  if(!prevLog?.workerStatus){alert("先週同曜日のデータがありません");return}
  if(!s.dayLogs[dk])s.dayLogs[dk]={};
  s.dayLogs[dk].workerStatus={...prevLog.workerStatus};
  saveSites(sites);
  renderToday();
}

function saveSiteMemo(siteId,val){
  const dk=todayKey();
  const sites=loadSites();
  const si=sites.findIndex(s=>s.id===siteId);
  if(si<0)return;
  if(!sites[si].dayLogs[dk])sites[si].dayLogs[dk]={};
  sites[si].dayLogs[dk].memo=val;
  saveSites(sites);
}

// ─── FULLCALENDAR ────────────────────────────────────────────
let fcInstance=null;

function initFullCalendar(){
  const el=document.getElementById("fc-container");
  if(!el)return;
  if(fcInstance){fcInstance.destroy();fcInstance=null}
  const s=getSite();
  if(!s){el.innerHTML=`<div style="padding:40px;text-align:center;color:#94A3B8">現場を選択してください</div>`;return}

  fcInstance=new FullCalendar.Calendar(el,{
    locale:"ja",
    initialView:"dayGridMonth",
    height:"auto",
    firstDay:0,
    fixedWeekCount:false,
    headerToolbar:{
      left:"prev,next today",
      center:"title",
      right:"dayGridMonth,dayGridWeek"
    },
    buttonText:{today:"今日",month:"月",week:"週"},
    dayMaxEventRows:3,
    events:fcGetEvents(s),
    editable:true,
    eventStartEditable:true,
    eventDurationEditable:true,
    dateClick:function(info){openDayPanel(info.dateStr)},
    eventClick:function(info){
      info.jsEvent.preventDefault();
      const evId=info.event.extendedProps.siteEventId;
      if(evId)showEventModal(evId);
    },
    eventDrop:function(info){fcHandleEventMove(info)},
    eventResize:function(info){fcHandleEventResize(info)},
    dayCellDidMount:function(info){fcRenderDayCell(info)},
    datesSet:function(info){
      const mid=new Date((info.start.getTime()+info.end.getTime())/2);
      calYear=mid.getFullYear();calMonth=mid.getMonth();
      updateCalSub();
      renderEventList();
    }
  });
  fcInstance.render();
  updateCalSub();
}

function fcGetEvents(s){
  if(!s||!s.events)return[];
  return s.events.map(e=>({
    id:e.id,
    title:e.title,
    start:e.start,
    end:fcEndDate(e.end),
    backgroundColor:e.color,
    borderColor:e.color,
    extendedProps:{siteEventId:e.id}
  }));
}

// FullCalendar uses exclusive end dates, so add 1 day
function fcEndDate(dateStr){
  const d=new Date(dateStr);
  d.setDate(d.getDate()+1);
  return d.toISOString().split("T")[0];
}

function fcHandleEventMove(info){
  const evId=info.event.extendedProps.siteEventId;
  const newStart=info.event.startStr;
  const endD=new Date(info.event.endStr||info.event.startStr);
  endD.setDate(endD.getDate()-1);
  const newEnd=endD.toISOString().split("T")[0];
  updateSite(s=>{
    const ev=(s.events||[]).find(e=>e.id===evId);
    if(ev){ev.start=newStart;ev.end=newEnd}
  });
  updateCalSub();renderEventList();
}

function fcHandleEventResize(info){
  fcHandleEventMove(info);
}

function fcRenderDayCell(info){
  const s=getSite();if(!s)return;
  const ds=info.date.toLocaleDateString("sv-SE");
  const log=s.dayLogs?.[ds]||{};
  const planH=Math.max(log.plannedHeadcount||0,(log.planWorkers?Object.values(log.planWorkers).filter(v=>v==="planned").length:0));
  let actH=0;if(log.workerStatus)Object.values(log.workerStatus).forEach(st=>{if(st==="present"||st==="half")actH++});
  const hasMemo=!!log.memo;

  const badge=document.createElement("div");
  badge.style.cssText="display:flex;align-items:center;gap:2px;justify-content:flex-end;padding:0 4px 2px";
  if(actH>0){
    const sp=document.createElement("span");
    sp.className="fc-ninku-badge fc-ninku-actual";
    sp.textContent=actH;
    badge.appendChild(sp);
  }else if(planH>0){
    const sp=document.createElement("span");
    sp.className="fc-ninku-badge fc-ninku-plan";
    sp.textContent=planH;
    badge.appendChild(sp);
  }
  if(hasMemo){
    const dot=document.createElement("span");
    dot.className="fc-memo-dot";
    badge.appendChild(dot);
  }
  if(actH>0||planH>0||hasMemo){
    info.el.querySelector(".fc-daygrid-day-frame")?.appendChild(badge);
  }
}

function updateCalSub(){
  const s=getSite();if(!s)return;
  document.getElementById("cal-title").innerHTML=(s.name||"カレンダー")+' <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24" style="vertical-align:middle;opacity:.6"><polyline points="6,9 12,15 18,9"/></svg>';
  const dim=daysInMonth(calYear,calMonth);
  let total=0;
  for(let d=1;d<=dim;d++){
    const log=s.dayLogs?.[dkey(calYear,calMonth,d)]||{};
    if(log.workerStatus)Object.values(log.workerStatus).forEach(st=>{if(st==="present")total+=1;else if(st==="half")total+=.5});
  }
  document.getElementById("cal-sub").textContent=`合計 ${total} 人工`;
}

function renderCalendar(){
  initFullCalendar();
}

function renderEventList(){
  const s=getSite();if(!s)return;
  const evs=(s.events||[]).filter(e=>{const ms=dkey(calYear,calMonth,1),me=dkey(calYear,calMonth,daysInMonth(calYear,calMonth));return e.start<=me&&e.end>=ms}).sort((a,b)=>a.start.localeCompare(b.start));
  const el=document.getElementById("cal-event-list");
  if(!evs.length){el.innerHTML=`<div style="padding:16px;text-align:center;color:#94A3B8;font-size:13px">工程がありません</div>`;return}
  el.innerHTML=evs.map(e=>{
    const sd=parseInt(e.start.split("-")[2]),ed=parseInt(e.end.split("-")[2]);
    return`<div onclick="showEventModal('${e.id}')" style="display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #F0F2F8;cursor:pointer">
      <div style="width:4px;height:28px;border-radius:2px;background:${e.color}"></div>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">${escHtml(e.title)}</div><div style="font-size:12px;color:#94A3B8;margin-top:2px">${sd}日〜${ed}日</div></div>
    </div>`}).join("");
}

// ─── DAY DETAIL PANEL (S1) ──────────────────────────────────
let dpDate=null;
let dpTab="actual";

function openDayPanel(dateStr){
  dpDate=new Date(dateStr+"T00:00:00");
  dpTab="actual";
  renderDayPanel();
  document.getElementById("day-panel-bg").classList.remove("hidden");
}

function closeDayPanel(){
  document.getElementById("day-panel-bg").classList.add("hidden");
  if(fcInstance)fcInstance.refetchEvents();
  initFullCalendar();
}

function dpPrev(){dpDate.setDate(dpDate.getDate()-1);renderDayPanel()}
function dpNext(){dpDate.setDate(dpDate.getDate()+1);renderDayPanel()}

function dpSwitchTab(tab,btn){
  dpTab=tab;
  document.querySelectorAll(".dp-tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");
  renderDayPanel();
}

function dpDateStr(){return dpDate.toLocaleDateString("sv-SE")}

function renderDayPanel(){
  const s=getSite();if(!s)return;
  const ds=dpDateStr();
  const d=dpDate;
  document.getElementById("dp-title").textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${DAY_JP[d.getDay()]}）`;

  const log=s.dayLogs?.[ds]||{};
  const workers=sortedWorkers(s);
  const evs=eventsOnDate(s,ds);
  const el=document.getElementById("dp-content");

  // Events on this day
  let evHTML="";
  if(evs.length>0){
    evHTML=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${evs.map(e=>`<span style="background:${e.color};color:#fff;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600">${escHtml(e.title)}</span>`).join("")}</div>`;
  }

  if(dpTab==="actual"){
    // Actual attendance
    let nk=0;
    const membersHTML=workers.length>0?workers.map(w=>{
      const st=log.workerStatus?.[w.id]||"";
      if(st==="present")nk+=1;else if(st==="half")nk+=0.5;
      return`<div class="mc" data-s="${st}" onclick="dpToggleStatus('${w.id}')" style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;cursor:pointer;border:1.5px solid transparent;margin-bottom:4px;${st==="present"?"background:#ECFDF5;border-color:#A7F3D0":st==="half"?"background:#FFFBEB;border-color:#FDE68A":st==="absent"?"background:#FEF2F2;border-color:#FECACA":"background:#F8FAFC;border-color:#E2E8F0"}">
        <div style="width:32px;height:32px;border-radius:10px;background:${w.color};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff">${workerIcon(w)}</div>
        <span style="flex:1;font-size:14px;font-weight:600">${escHtml(w.name)}</span>
        <span style="font-size:13px;font-weight:700;color:${st==="present"?"#059669":st==="half"?"#D97706":st==="absent"?"#DC2626":"#CBD5E1"}">${STATUS_LABEL[st]}</span>
      </div>`}).join(""):`<div style="color:#94A3B8;font-size:13px;text-align:center;padding:16px">メンバーが登録されていません</div>`;

    el.innerHTML=`${evHTML}
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="font-size:16px;font-weight:800;color:#4F46E5">${nk} <span style="font-size:12px;color:#94A3B8;font-weight:600">人工</span></div>
        <div style="display:flex;gap:4px">
          <button class="btn btn-outline btn-sm" onclick="dpCopyFrom('yesterday')" style="font-size:11px;min-height:30px;padding:5px 8px">昨日と同じ</button>
          <button class="btn btn-outline btn-sm" onclick="dpCopyFrom('lastweek')" style="font-size:11px;min-height:30px;padding:5px 8px">先週同曜日</button>
        </div>
      </div>
      ${membersHTML}
      <div style="margin-top:12px">
        <div class="label">作業メモ</div>
        <textarea class="field" placeholder="作業メモ..." oninput="dpSaveMemo(this.value)">${escHtml(log.memo||"")}</textarea>
      </div>`;
  }else{
    // Plan
    const planH=log.plannedHeadcount||0;
    const membersHTML=workers.length>0?workers.map(w=>{
      const planned=log.planWorkers?.[w.id]==="planned";
      return`<div onclick="dpTogglePlan('${w.id}')" style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;cursor:pointer;border:1.5px solid ${planned?"#C7D2FE":"#E2E8F0"};background:${planned?"#EEF2FF":"#F8FAFC"};margin-bottom:4px">
        <div style="width:32px;height:32px;border-radius:10px;background:${w.color};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff">${workerIcon(w)}</div>
        <span style="flex:1;font-size:14px;font-weight:600">${escHtml(w.name)}</span>
        <span style="font-size:13px;font-weight:700;color:${planned?"#4F46E5":"#CBD5E1"}">${planned?"予定":"—"}</span>
      </div>`}).join(""):"";

    el.innerHTML=`${evHTML}
      <div style="margin-bottom:12px">
        <div class="label">予定人数</div>
        <input type="number" class="field" value="${planH}" min="0" oninput="dpSavePlanH(this.value)" style="width:100px">
      </div>
      ${membersHTML}
      <div style="margin-top:12px">
        <div class="label">工程予定メモ</div>
        <textarea class="field" placeholder="工程予定メモ..." oninput="dpSavePlanMemo(this.value)">${escHtml(log.planMemo||"")}</textarea>
      </div>`;
  }
}

function dpToggleStatus(wId){
  const ds=dpDateStr();
  const sites=loadSites();
  const si=sites.findIndex(s=>s.id===currentSiteId);if(si<0)return;
  const s=sites[si];
  if(!s.dayLogs[ds])s.dayLogs[ds]={};
  if(!s.dayLogs[ds].workerStatus)s.dayLogs[ds].workerStatus={};
  const cur=s.dayLogs[ds].workerStatus[wId]||"";
  s.dayLogs[ds].workerStatus[wId]=STATUS_CYCLE[(STATUS_CYCLE.indexOf(cur)+1)%STATUS_CYCLE.length];
  saveSites(sites);
  renderDayPanel();
}

function dpTogglePlan(wId){
  const ds=dpDateStr();
  const sites=loadSites();
  const si=sites.findIndex(s=>s.id===currentSiteId);if(si<0)return;
  const s=sites[si];
  if(!s.dayLogs[ds])s.dayLogs[ds]={};
  if(!s.dayLogs[ds].planWorkers)s.dayLogs[ds].planWorkers={};
  s.dayLogs[ds].planWorkers[wId]=s.dayLogs[ds].planWorkers[wId]==="planned"?"":"planned";
  saveSites(sites);
  renderDayPanel();
}

function dpSaveMemo(val){
  const ds=dpDateStr();
  updateSite(s=>{if(!s.dayLogs[ds])s.dayLogs[ds]={};s.dayLogs[ds].memo=val});
}

function dpSavePlanMemo(val){
  const ds=dpDateStr();
  updateSite(s=>{if(!s.dayLogs[ds])s.dayLogs[ds]={};s.dayLogs[ds].planMemo=val});
}

function dpSavePlanH(val){
  const ds=dpDateStr();
  updateSite(s=>{if(!s.dayLogs[ds])s.dayLogs[ds]={};s.dayLogs[ds].plannedHeadcount=parseInt(val)||0});
}

function dpCopyFrom(source){
  const ds=dpDateStr();
  const target=new Date(dpDate);
  if(source==="yesterday"){
    do{target.setDate(target.getDate()-1)}while(target.getDay()===0||target.getDay()===6);
  }else if(source==="lastweek"){
    target.setDate(target.getDate()-7);
  }
  const srcKey=target.toLocaleDateString("sv-SE");
  const sites=loadSites();
  const si=sites.findIndex(s=>s.id===currentSiteId);if(si<0)return;
  const s=sites[si];
  const srcLog=s.dayLogs?.[srcKey];
  if(!srcLog?.workerStatus){alert("コピー元のデータがありません");return}
  if(!s.dayLogs[ds])s.dayLogs[ds]={};
  s.dayLogs[ds].workerStatus={...srcLog.workerStatus};
  saveSites(sites);
  renderDayPanel();
}

// ─── SETTINGS SCREEN ─────────────────────────────────────────
function renderSettings(){
  const s=getSite();if(!s)return;
  renderSiteForm();
  renderWorkerList();
}

function toggleSiteEdit(){editingSiteMode=!editingSiteMode;renderSiteForm()}

function renderSiteForm(){
  const s=getSite();if(!s)return;
  const el=document.getElementById("site-form");
  const btn=document.getElementById("edit-toggle");
  btn.textContent=editingSiteMode?"完了":"編集";
  const fields=[
    {k:"name",l:"現場名"},{k:"address",l:"住所"},{k:"generalContractor",l:"元請会社"},{k:"gcManager",l:"元請担当者"},
    {k:"manager",l:"自社担当者"},{k:"phone",l:"電話番号",type:"tel"},{k:"notes",l:"備考",multi:true}
  ];
  if(editingSiteMode){
    el.innerHTML=fields.map(f=>{
      const v=s[f.k]||"";
      return`<div style="margin-bottom:12px"><div class="label">${f.l}</div>${f.multi
        ?`<textarea class="field" rows="2" oninput="updateSiteField('${f.k}',this.value)">${escHtml(v)}</textarea>`
        :`<input type="${f.type||"text"}" class="field" value="${escHtml(v)}" oninput="updateSiteField('${f.k}',this.value)">`}</div>`;
    }).join("");
  } else {
    const addr=s.address||"",phone=s.phone||"";
    el.innerHTML=fields.map(f=>{
      const v=s[f.k]||"";
      let display=`<span style="font-size:15px;color:${v?"#1A2240":"#B0BAC8"}">${escHtml(v)||"—"}</span>`;
      if(f.k==="address"&&v)display=`<a href="https://www.google.com/maps/search/${encodeURIComponent(v)}" target="_blank" style="color:#2563EB;font-size:15px;text-decoration:none">${escHtml(v)}</a>`;
      if(f.k==="phone"&&v)display=`<a href="tel:${v.replace(/[^\d+]/g,"")}" style="color:#2563EB;font-size:15px;text-decoration:none">${escHtml(v)}</a>`;
      return`<div style="margin-bottom:10px"><div class="label">${f.l}</div>${display}</div>`;
    }).join("");
  }
}

function updateSiteField(k,v){updateSite(s=>{s[k]=v});if(k==="name")document.getElementById("today-site-name").textContent=v||"現場名未設定"}

function renderWorkerList(){
  const s=getSite();if(!s)return;
  const ws=sortedWorkers(s);
  const el=document.getElementById("worker-list");
  if(!ws.length){
    const missing=DEFAULT_WORKERS;
    el.innerHTML=`<div style="padding:16px;text-align:center"><p style="color:#94A3B8;font-size:13px;margin:0 0 12px">メンバーを追加してください</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">${missing.map(w=>`<button class="btn btn-outline btn-sm" onclick="addDefaultMember('${w.id}')">${w.icon} ${w.name}</button>`).join("")}</div></div>`;
    return;
  }
  el.innerHTML=ws.map(w=>{
    const sf=w.starred?"#F59E0B":"none",ss=w.starred?"#F59E0B":"#CBD5E1";
    return`<div class="w-row">
      <button class="star-btn" onclick="toggleStar('${w.id}')"><svg width="18" height="18" fill="${sf}" stroke="${ss}" stroke-width="2" stroke-linejoin="round" viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></button>
      <div class="av" style="background:${w.color}">${workerIcon(w)}</div>
      <span style="flex:1;font-size:15px;font-weight:600">${w.name}</span>
      <button class="btn btn-ghost btn-sm" onclick="openWorkerEdit('${w.id}')">編集</button>
    </div>`}).join("");
}

function toggleStar(wId){updateSite(s=>{const w=s.workers.find(w=>w.id===wId);if(w)w.starred=!w.starred});renderWorkerList()}
function addDefaultMember(defId){
  const t=DEFAULT_WORKERS.find(w=>w.id===defId);if(!t)return;
  updateSite(s=>{if(s.workers.some(w=>w.name===t.name))return;s.workers.push({...t,id:t.id+"-"+uid()})});
  renderWorkerList();renderToday();
}

// ─── SITE CRUD ───────────────────────────────────────────────
function addSite(){
  const dw=DEFAULT_WORKERS.map(w=>({...w,id:w.id+"-"+uid()}));
  const s={id:uid(),name:"",address:"",generalContractor:"",gcManager:"",manager:"",phone:"",notes:"",workers:dw,dayLogs:{},events:[],createdAt:new Date().toISOString()};
  const sites=loadSites();sites.unshift(s);saveSites(sites);
  currentSiteId=s.id;editingSiteMode=true;switchTab("settings");
}
function deleteSite(){
  if(!confirm("この現場を削除しますか？"))return;
  const sites=loadSites().filter(s=>s.id!==currentSiteId);saveSites(sites);
  currentSiteId=sites[0]?.id||null;switchTab("today");
}

// ─── WORKER MODAL ────────────────────────────────────────────
function showWorkerModal(editW){
  editingWorkerId=editW?editW.id:null;
  document.getElementById("wm-title").textContent=editW?"メンバーを編集":"メンバーを追加";
  document.getElementById("wm-name").value=editW?editW.name:"";
  document.getElementById("wm-icon").value=editW?(editW.icon||""):"";
  selectedWorkerColor=editW?editW.color:WORKER_COLORS[0];
  document.getElementById("wm-del").classList.toggle("hidden",!editW);
  renderWmColors();updateWmPreview();
  document.getElementById("worker-modal").classList.remove("hidden");
}
function hideWorkerModal(){document.getElementById("worker-modal").classList.add("hidden");editingWorkerId=null}
function renderWmColors(){
  document.getElementById("wm-colors").innerHTML=WORKER_COLORS.map(c=>{
    const sel=c===selectedWorkerColor;
    return`<button class="color-dot" onclick="selectedWorkerColor='${c}';renderWmColors();updateWmPreview()" style="background:${c};box-shadow:${sel?`0 0 0 3px #fff,0 0 0 5px ${c}`:`none`};transform:${sel?"scale(1.1)":"scale(1)"}">
      ${sel?`<svg width="16" height="16" fill="none" stroke="#fff" stroke-width="3" viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12"/></svg>`:""}</button>`}).join("");
}
function updateWmPreview(){
  const n=document.getElementById("wm-name").value.trim();
  const ic=document.getElementById("wm-icon").value.trim()||n.charAt(0)||"?";
  const p=document.getElementById("wm-preview");
  p.textContent=ic;p.style.background=selectedWorkerColor;
}
document.addEventListener("input",e=>{if(e.target.id==="wm-name"||e.target.id==="wm-icon")updateWmPreview()});

function saveWorkerFromModal(){
  const name=document.getElementById("wm-name").value.trim();if(!name)return;
  const icon=document.getElementById("wm-icon").value.trim();
  if(editingWorkerId){
    updateSite(s=>{const w=s.workers.find(w=>w.id===editingWorkerId);if(w){w.name=name;w.color=selectedWorkerColor;w.icon=icon}});
  }else{
    updateSite(s=>{s.workers.push({id:uid(),name,color:selectedWorkerColor,icon,starred:false})});
  }
  hideWorkerModal();renderSettings();renderToday();
}
function deleteWorkerFromModal(){
  if(!confirm("削除しますか？"))return;
  updateSite(s=>{s.workers=s.workers.filter(w=>w.id!==editingWorkerId)});
  hideWorkerModal();renderSettings();renderToday();
}
function openWorkerEdit(wId){const s=getSite();const w=s?.workers.find(w=>w.id===wId);if(w)showWorkerModal(w)}

// ─── EVENT MODAL ─────────────────────────────────────────────
function showEventModal(evId){
  const s=getSite();if(!s)return;
  editingEventId=evId||null;
  const ev=evId?(s.events||[]).find(e=>e.id===evId):null;
  document.getElementById("em-title").textContent=ev?"工程を編集":"工程を追加";
  document.getElementById("em-del").classList.toggle("hidden",!ev);
  document.getElementById("em-name").value=ev?ev.title:"";
  document.getElementById("em-start").value=ev?ev.start:dkey(calYear,calMonth,1);
  document.getElementById("em-end").value=ev?ev.end:dkey(calYear,calMonth,1);
  selectedEventColor=ev?ev.color:EVENT_COLORS[0];
  renderEmColors();
  document.getElementById("event-modal").classList.remove("hidden");
}
function hideEventModal(){document.getElementById("event-modal").classList.add("hidden");editingEventId=null}
function renderEmColors(){
  document.getElementById("em-colors").innerHTML=EVENT_COLORS.map(c=>{
    const sel=c===selectedEventColor;
    return`<button class="color-dot" onclick="selectedEventColor='${c}';renderEmColors()" style="background:${c};box-shadow:${sel?`0 0 0 3px #fff,0 0 0 5px ${c}`:`none`};transform:${sel?"scale(1.1)":"scale(1)"}">
      ${sel?`<svg width="16" height="16" fill="none" stroke="#fff" stroke-width="3" viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12"/></svg>`:""}</button>`}).join("");
}
function saveEventFromModal(){
  const title=document.getElementById("em-name").value.trim();
  const start=document.getElementById("em-start").value;
  const end=document.getElementById("em-end").value;
  if(!title||!start||!end)return;
  if(end<start){alert("終了日は開始日以降にしてください");return}
  updateSite(s=>{
    if(!s.events)s.events=[];
    if(editingEventId){const e=s.events.find(e=>e.id===editingEventId);if(e){e.title=title;e.start=start;e.end=end;e.color=selectedEventColor}}
    else s.events.push({id:uid(),title,start,end,color:selectedEventColor});
  });
  hideEventModal();initFullCalendar();renderEventList();
}
function deleteEventFromModal(){
  if(!confirm("この工程を削除しますか？"))return;
  updateSite(s=>{s.events=(s.events||[]).filter(e=>e.id!==editingEventId)});
  hideEventModal();initFullCalendar();renderEventList();
}

.lbl{font-size:7px;color:#94A3B8;font-weight:700;margin-top:2px}table.stbl{width:100%;border-collapse:collapse;font-size:7.5px}table.stbl th{background:#F1F5F9;padding:2px 3px;border:1px solid #E2E8F0;font-weight:700;text-align:center;color:#64748B;font-size:6.5px}table.stbl td{padding:2px 3px;border:1px solid #E2E8F0}table.stbl td.nm{white-space:nowrap}table.stbl td.ct{text-align:center;font-weight:700}table.stbl td.tt{text-align:center;font-weight:900;color:#4338CA}.foot{font-size:7px;color:#94A3B8;margin-top:4px;padding-top:2px;border-top:1px solid #E2E8F0;overflow:hidden}.foot span{float:left}.foot span:last-child{float:right}</style></head><body><h1>${escHtml(s.name||"現場")}</h1><span class="period">${calYear}年${calMonth+1}月 出面表</span><div class="info-row"><span><b>現場名</b>${escHtml(s.name||"—")}</span><span><b>元請会社</b>${escHtml(gc||"—")}</span><span><b>元請担当</b>${escHtml(gcm||"—")}</span><span><b>TEL</b>${escHtml(s.phone||"—")}</span><span><b>住所</b>${escHtml(s.address||"—")}</span></div><div class="cols"><div class="col-main"><table class="att"><thead><tr><th>日</th><th>曜</th>${wH}<th style="width:20px">人工</th><th style="width:60px">メモ</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="2" style="font-size:7px">合計</td>${wF}<td style="font-weight:900;color:#4338CA;font-size:8px">${gt}</td><td></td></tr></tfoot></table></div><div class="col-side"><div class="sum-card"><div class="big">${gt}</div><div class="lbl">月間合計人工</div></div><table class="stbl"><thead><tr><th>氏名</th><th style="width:22px">出勤</th><th style="width:22px">半日</th><th style="width:26px">人工</th></tr></thead><tbody>${sR}</tbody></table></div></div><div class="foot"><span>○ 出勤（1人工）／ △ 半日（0.5人工）</span><span>出力日: ${new Date().toLocaleDateString("ja-JP")}　彩心堂</span></div></body></html>`;

// ─── CSV EXPORT ─────────────────────────────────────────────
function exportCSV(){
  const s=getSite();if(!s)return;
  const sw=sortedWorkers(s),days=daysInMonth(calYear,calMonth);
  const activeWorkers=sw.filter(w=>{for(let d=1;d<=days;d++){const st=s.dayLogs?.[dkey(calYear,calMonth,d)]?.workerStatus?.[w.id]||"";if(st==="present"||st==="half")return true}return false});

  // Header row
  const headers=["日","曜日",...activeWorkers.map(w=>w.name),"人工","メモ"];
  const rows=[headers.map(h=>'"'+h.replace(/"/g,'""')+'"').join(",")];

  // Data rows
  for(let d=1;d<=days;d++){
    const k=dkey(calYear,calMonth,d),log=s.dayLogs?.[k]||{};
    const wd=jpDay(calYear,calMonth,d);
    let nk=0;
    const cols=[d,wd];
    activeWorkers.forEach(w=>{
      const st=log.workerStatus?.[w.id]||"";
      if(st==="present"){nk+=1;cols.push("○")}
      else if(st==="half"){nk+=0.5;cols.push("△")}
      else if(st==="absent"){cols.push("×")}
      else{cols.push("")}
    });
    cols.push(nk>0?nk:"");
    cols.push(log.memo||"");
    rows.push(cols.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(","));
  }

  // Total row
  const totals=["合計",""];
  let gt=0;
  activeWorkers.forEach(w=>{
    let n=0;
    for(let d=1;d<=days;d++){const st=s.dayLogs?.[dkey(calYear,calMonth,d)]?.workerStatus?.[w.id]||"";if(st==="present")n+=1;else if(st==="half")n+=0.5}
    totals.push(n);gt+=n;
  });
  totals.push(gt,"");
  rows.push(totals.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(","));

  const bom="\uFEFF";
  const blob=new Blob([bom+rows.join("\n")],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`${s.name||"現場"}_${calYear}年${calMonth+1}月_出面表.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
