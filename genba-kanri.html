<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="現場管理">
<meta name="theme-color" content="#1E293B">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="./assets/icon-512.png">
<title>彩心堂 現場管理</title>
<style>
/* ═══ RESET & BASE ═══ */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#F1F3F9;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Meiryo","Noto Sans JP",sans-serif;color:#1A2240;font-size:15px;-webkit-text-size-adjust:100%;overscroll-behavior:none}
input,textarea,button,select{font-family:inherit;font-size:16px}
input::placeholder,textarea::placeholder{color:#A0AAC0}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:0}

/* ═══ LAYOUT ═══ */
.app{min-height:100vh;display:flex;flex-direction:column}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.view.hidden{display:none}
.top-header{background:#1E293B;color:#fff;padding:calc(env(safe-area-inset-top,20px) + 8px) 20px 14px;position:sticky;top:0;z-index:50}
.top-header h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-.3px}
.top-header .sub{font-size:12px;color:#94A3B8;font-weight:500}
.container{max-width:540px;margin:0 auto;padding:14px 16px 24px}

/* ═══ BOTTOM TAB BAR ═══ */
.tab-bar-bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #E2E8F0;display:grid;grid-template-columns:1fr 1fr 1fr;z-index:100;padding-bottom:env(safe-area-inset-bottom,0px)}
.tab-bar-bottom button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 6px;font-size:10px;font-weight:600;color:#94A3B8;transition:color .15s}
.tab-bar-bottom button.active{color:#4F46E5}
.tab-bar-bottom button svg{width:22px;height:22px}

/* ═══ CARDS ═══ */
.card{background:#fff;border-radius:16px;border:1px solid #E8EAF2;box-shadow:0 1px 3px rgba(20,30,80,.04);overflow:hidden;margin-bottom:14px}
.card-hd{padding:14px 18px;border-bottom:1px solid #F0F2F8;display:flex;align-items:center;justify-content:space-between;min-height:48px}
.card-hd .title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px;color:#3B4563}

/* ═══ BUTTONS ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;font-weight:700;min-height:44px;padding:10px 20px;font-size:15px;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.96);opacity:.85}
.btn-primary{background:linear-gradient(135deg,#4F46E5,#6D28D9);color:#fff;box-shadow:0 2px 10px rgba(79,70,229,.25)}
.btn-outline{background:#fff;color:#4F46E5;border:1.5px solid #C7D2FE}
.btn-ghost{color:#64748B;padding:10px}
.btn-sm{min-height:36px;padding:8px 14px;font-size:13px;border-radius:10px}
.btn-success{background:#059669;color:#fff}
.btn-danger{background:#FEF2F2;color:#DC2626;border:1px solid #FEE2E2}

/* ═══ FIELDS ═══ */
.field{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid #E2E8F0;background:#F8FAFC;color:#1A2240;font-size:16px;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:#4F46E5;background:#fff;box-shadow:0 0 0 3px #EEF2FF;outline:none}
textarea.field{resize:none;line-height:1.5;min-height:52px}
.label{font-size:13px;color:#64748B;font-weight:600;margin-bottom:6px}

/* ═══ TODAY: MEMBER CARDS ═══ */
.member-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.m-card{border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .12s,box-shadow .12s;border:2px solid transparent;min-height:90px;position:relative}
.m-card:active{transform:scale(.95)}
.m-card .avatar{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff}
.m-card .name{font-size:13px;font-weight:700;color:#334155;text-align:center}
.m-card .status{font-size:14px;font-weight:800;letter-spacing:.3px}
/* Card states */
.m-card[data-st="present"]{background:#ECFDF5;border-color:#A7F3D0}
.m-card[data-st="present"] .status{color:#059669}
.m-card[data-st="half"]{background:#FFFBEB;border-color:#FDE68A}
.m-card[data-st="half"] .status{color:#D97706}
.m-card[data-st="absent"]{background:#FEF2F2;border-color:#FECACA}
.m-card[data-st="absent"] .status{color:#DC2626}
.m-card[data-st=""]{background:#F8FAFC;border-color:#E2E8F0}
.m-card[data-st=""] .status{color:#CBD5E1}

/* ═══ SUMMARY BAR ═══ */
.summary-bar{display:flex;align-items:center;justify-content:center;gap:20px;padding:12px;background:#F1F5F9;border-radius:12px;margin:10px 0}
.summary-bar .num{font-size:24px;font-weight:900;color:#4F46E5}
.summary-bar .lbl{font-size:11px;color:#94A3B8;font-weight:600}

/* ═══ CALENDAR (iOS-style) ═══ */
.cal-card{overflow:hidden}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #E8EAF2}
.dow-hd{padding:10px 0;text-align:center;font-size:12px;font-weight:600;color:#94A3B8}
.week-row{border-bottom:1px solid #F0F2F8;min-height:86px;display:flex;flex-direction:column}
.week-row:last-child{border-bottom:none}
.week-nums{display:grid;grid-template-columns:repeat(7,1fr)}
.day-c{padding:6px 3px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-height:40px;border-right:1px solid #F4F5FA}
.day-c:last-child{border-right:none}
.day-c:active{background:#EEF2FF}
.day-c.sel{background:#EEF2FF}
.day-c .dn{font-size:13px;font-weight:700;color:#64748B;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%}
.day-c.sel .dn{background:#4F46E5;color:#fff !important}
.day-c .dn.today{background:#4F46E5;color:#fff !important;font-weight:800}
.day-c .dn.sun{color:#DC2626}
.day-c .dn.sat{color:#2563EB}
.day-c .ind{display:flex;align-items:center;gap:2px}
.day-c .pn{font-size:11px;font-weight:800;color:#2563EB}
.day-c .an{min-width:18px;height:18px;border-radius:50%;background:#DC2626;color:#fff;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.day-c .dot{width:5px;height:5px;border-radius:50%}
.week-bars{flex:1;display:flex;flex-direction:column;gap:2px;padding:2px 0 3px}
.bar-row{display:grid;grid-template-columns:repeat(7,1fr)}
.ev-bar{height:20px;font-size:11px;font-weight:600;color:#fff;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;border-radius:4px;margin:0 2px}
.ev-bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.ev-bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}

/* ═══ MODAL ═══ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-bg.hidden{display:none!important}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:8px 20px calc(env(safe-area-inset-bottom,0px) + 24px);max-height:85vh;overflow-y:auto}
.modal-handle{width:36px;height:5px;border-radius:3px;background:#E2E8F0;margin:0 auto 16px}
.color-dot{width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.color-dot:active{transform:scale(.9)}

/* ═══ ANIMATIONS ═══ */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.fade-in{animation:fadeIn .25s ease both}
.slide-up{animation:slideUp .25s cubic-bezier(.16,1,.3,1)}

/* ═══ WORKER LIST (settings) ═══ */
.w-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #F0F2F8;min-height:52px}
.w-row:last-child{border-bottom:none}
.w-row .av{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0}
.star-btn{padding:10px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="app">

<!-- ═══ TAB 1: TODAY ═══ -->
<div id="view-today" class="view">
  <div class="top-header">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <h1 id="today-site-name">現場管理</h1>
        <div class="sub" id="today-date"></div>
      </div>
      <button class="btn btn-sm" style="background:rgba(255,255,255,.12);color:#fff" id="site-switch-btn" onclick="showSiteSwitch()">切替</button>
    </div>
    <div id="today-event" style="margin-top:8px"></div>
  </div>
  <div class="container">
    <div id="today-summary" class="summary-bar"></div>
    <div id="today-members" class="member-grid"></div>
    <div id="today-actions" style="margin:10px 0"></div>
    <div id="today-memo" style="margin-top:8px"></div>
  </div>
</div>

<!-- ═══ TAB 2: CALENDAR ═══ -->
<div id="view-calendar" class="view hidden">
  <div class="top-header">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <h1 id="cal-title">カレンダー</h1>
        <div class="sub" id="cal-sub"></div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm" style="background:rgba(255,255,255,.12);color:#fff" onclick="goCalToday()">今日</button>
        <button class="btn btn-sm" style="background:rgba(255,255,255,.12);color:#fff" onclick="exportPDF()">PDF</button>
      </div>
    </div>
  </div>
  <div class="container">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <button class="btn btn-ghost" onclick="calPrev()" style="padding:10px"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg></button>
      <div id="cal-month" style="font-size:18px;font-weight:800;text-align:center"></div>
      <button class="btn btn-ghost" onclick="calNext()" style="padding:10px"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><polyline points="9,18 15,12 9,6"/></svg></button>
    </div>
    <div class="card cal-card">
      <div class="dow-row">
        <div class="dow-hd" style="color:#DC2626">日</div><div class="dow-hd">月</div><div class="dow-hd">火</div><div class="dow-hd">水</div><div class="dow-hd">木</div><div class="dow-hd">金</div><div class="dow-hd" style="color:#2563EB">土</div>
      </div>
      <div id="cal-grid"></div>
    </div>
    <div id="cal-events" class="card" style="margin-top:14px">
      <div class="card-hd">
        <span class="title">工程</span>
        <button class="btn btn-sm btn-primary" onclick="showEventModal()">+ 追加</button>
      </div>
      <div id="cal-event-list"></div>
    </div>
  </div>
</div>

<!-- ═══ TAB 3: SETTINGS ═══ -->
<div id="view-settings" class="view hidden">
  <div class="top-header">
    <h1>設定</h1>
  </div>
  <div class="container">
    <div class="card">
      <div class="card-hd"><span class="title">現場情報</span><button class="btn btn-sm btn-outline" id="edit-toggle" onclick="toggleSiteEdit()">編集</button></div>
      <div id="site-form" style="padding:16px"></div>
    </div>
    <div class="card">
      <div class="card-hd"><span class="title">メンバー</span><button class="btn btn-sm btn-primary" onclick="showWorkerModal()">+ 追加</button></div>
      <div id="worker-list"></div>
    </div>
    <div class="card">
      <div class="card-hd"><span class="title">現場管理</span></div>
      <div style="padding:16px;display:flex;flex-direction:column;gap:10px">
        <button class="btn btn-outline" style="width:100%" onclick="addSite()">+ 新規現場を作成</button>
        <button class="btn btn-danger" style="width:100%" onclick="deleteSite()">この現場を削除</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ BOTTOM TAB BAR ═══ -->
<div class="tab-bar-bottom">
  <button id="tab-today" onclick="switchTab('today')" class="active">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><text x="12" y="18" text-anchor="middle" fill="currentColor" stroke="none" font-size="8" font-weight="800">今</text></svg>
    今日
  </button>
  <button id="tab-calendar" onclick="switchTab('calendar')">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    カレンダー
  </button>
  <button id="tab-settings" onclick="switchTab('settings')">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    設定
  </button>
</div>

</div><!-- /app -->

<!-- ═══ WORKER MODAL ═══ -->
<div id="worker-modal" class="modal-bg hidden">
  <div class="modal-sheet slide-up">
    <div class="modal-handle"></div>
    <h3 id="wm-title" style="font-size:18px;font-weight:800;margin:0 0 16px">メンバーを追加</h3>
    <div class="label">名前</div>
    <input type="text" id="wm-name" class="field" placeholder="名前を入力" style="margin-bottom:14px">
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <div style="flex:1"><div class="label">アイコン文字</div><input type="text" id="wm-icon" class="field" placeholder="1文字" maxlength="2" style="text-align:center;font-weight:800"></div>
      <div style="flex:1"><div class="label">プレビュー</div><div id="wm-preview" style="height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;background:#4F46E5">?</div></div>
    </div>
    <div class="label">カラー</div>
    <div id="wm-colors" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px"></div>
    <div style="display:flex;gap:8px">
      <button id="wm-del" class="btn btn-danger btn-sm hidden" onclick="deleteWorkerFromModal()" style="flex:0 0 auto">削除</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveWorkerFromModal()">保存</button>
    </div>
  </div>
</div>

<!-- ═══ EVENT MODAL ═══ -->
<div id="event-modal" class="modal-bg hidden">
  <div class="modal-sheet slide-up">
    <div class="modal-handle"></div>
    <h3 id="em-title" style="font-size:18px;font-weight:800;margin:0 0 16px">工程を追加</h3>
    <div class="label">工程名</div>
    <input type="text" id="em-name" class="field" placeholder="例: ボード貼り" style="margin-bottom:14px">
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <div style="flex:1"><div class="label">開始日</div><input type="date" id="em-start" class="field"></div>
      <div style="flex:1"><div class="label">終了日</div><input type="date" id="em-end" class="field"></div>
    </div>
    <div class="label">色</div>
    <div id="em-colors" style="display:flex;gap:10px;margin-bottom:18px"></div>
    <div style="display:flex;gap:8px">
      <button id="em-del" class="btn btn-danger btn-sm hidden" onclick="deleteEventFromModal()">削除</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveEventFromModal()">保存</button>
    </div>
  </div>
</div>

<!-- ═══ SITE SWITCH MODAL ═══ -->
<div id="site-modal" class="modal-bg hidden">
  <div class="modal-sheet slide-up">
    <div class="modal-handle"></div>
    <h3 style="font-size:18px;font-weight:800;margin:0 0 16px">現場を選択</h3>
    <div id="site-list-modal"></div>
    <button class="btn btn-outline" style="width:100%;margin-top:12px" onclick="addSite();hideSiteSwitch()">+ 新規現場</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     JAVASCRIPT
     ═══════════════════════════════════════════════════════════ -->
<script>
// ─── Constants ───────────────────────────────────────────────
const WORKER_COLORS=["#4F46E5","#E11D48","#0D9488","#D97706","#2563EB","#DC2626","#7C3AED","#059669","#EA580C","#0891B2","#BE185D","#65A30D","#0284C7","#C026D3","#9333EA","#0E7490","#B91C1C","#047857","#6D28D9","#C2410C"];
const EVENT_COLORS=["#4F46E5","#0EA5E9","#10B981","#F59E0B","#EF4444","#8B5CF6"];
const DEFAULT_WORKERS=[
  {id:"saishindo-1",name:"髙嶋 宏",color:"#DC2626",icon:"宏",starred:true},
  {id:"saishindo-2",name:"髙嶋 隆一",color:"#7C3AED",icon:"隆",starred:true},
  {id:"saishindo-3",name:"髙嶋 昇",color:"#059669",icon:"昇",starred:true},
  {id:"saishindo-4",name:"佐久間 英二",color:"#D97706",icon:"佐",starred:true},
];
const DAY_JP=["日","月","火","水","木","金","土"];
const STATUS_CYCLE=["","present","half","absent"];
const STATUS_LABEL={"":"—",present:"出勤",half:"半日",absent:"欠勤"};

// ─── Helpers ─────────────────────────────────────────────────
function uid(){return Math.random().toString(36).substr(2,9)+Date.now().toString(36)}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function firstDow(y,m){return new Date(y,m,1).getDay()}
function dkey(y,m,d){return`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
function jpDay(y,m,d){return DAY_JP[new Date(y,m,d).getDay()]}
function workerIcon(w){return w.icon||w.name.charAt(0)}
function sortedWorkers(s){if(!s||!s.workers)return[];return[...s.workers].sort((a,b)=>(b.starred?1:0)-(a.starred?1:0))}
function eventsOnDate(s,ds){if(!s||!s.events)return[];return s.events.filter(e=>ds>=e.start&&ds<=e.end)}
function escHtml(s){if(s==null)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

// ─── Storage ─────────────────────────────────────────────────
function loadSites(){try{return JSON.parse(localStorage.getItem("genba_sites")||"[]")}catch(e){return[]}}
function saveSites(sites){localStorage.setItem("genba_sites",JSON.stringify(sites))}

// ─── Demo Data ───────────────────────────────────────────────
function initDemoData(){
  const sites=loadSites();
  if(sites.length>0){
    let m=false;
    sites.forEach(s=>{if(!s.events){s.events=[];m=true}if(s.generalContractor===undefined){s.generalContractor="";m=true}if(s.gcManager===undefined){s.gcManager="";m=true}(s.workers||[]).forEach(w=>{if(w.starred===undefined){w.starred=false;m=true}})});
    if(m)saveSites(sites);
    return;
  }
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const logs={};

    const dow=new Date(y,m,d).getDay();if(dow===0||dow===6)continue;

    logs[k]={workerStatus:ws,planWorkers:pw,memo:mT[d%mT.length],planMemo:pT[d%pT.length]};
    if(d%5===0)logs[k].plannedHeadcount=3;
  }
  const dim=daysInMonth(y,m);
  const events=[
    {id:uid(),title:"LGS下地組み",start:dkey(y,m,Math.min(3,dim)),end:dkey(y,m,Math.min(7,dim)),color:"#4F46E5"},

  saveSites([{id:"demo1",name:"渋谷パークレジデンス 内装工事",address:"東京都渋谷区神南1-2-3",generalContractor:"渋谷建設株式会社",gcManager:"山本 一郎",manager:"髙嶋 宏",phone:"090-1234-5678",notes:"3階〜5階のリノベーション工事",workers:[
    {id:"w1",name:"髙嶋 宏",color:"#DC2626",icon:"宏",starred:true},
    {id:"w2",name:"髙嶋 隆一",color:"#7C3AED",icon:"隆",starred:true},

    {id:"w4",name:"佐久間 英二",color:"#D97706",icon:"佐",starred:true},
  ],dayLogs:logs,events:events,createdAt:new Date().toISOString()}]);
}

let currentTab="today";
let calYear=new Date().getFullYear();
let calMonth=new Date().getMonth();

function getSite(){return loadSites().find(s=>s.id===currentSiteId)||null}

// ─── Navigation ──────────────────────────────────────────────
function switchTab(t){
  currentTab=t;
  ["today","calendar","settings"].forEach(v=>{
    document.getElementById("view-"+v).classList.toggle("hidden",v!==t);
    document.getElementById("tab-"+v).classList.toggle("active",v===t);
  });
  if(t==="today")renderToday();
  else if(t==="calendar")renderCalendar();
  else if(t==="settings")renderSettings();
}

// ─── TODAY SCREEN ────────────────────────────────────────────
function todayKey(){const n=new Date();return dkey(n.getFullYear(),n.getMonth(),n.getDate())}

function renderToday(){
  const s=getSite();
  if(!s){document.getElementById("today-site-name").textContent="現場を選択してください";return}
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),d=now.getDate();
  const dk=todayKey(),log=s.dayLogs?.[dk]||{};
  const workers=sortedWorkers(s);

  // Header
  document.getElementById("today-site-name").textContent=s.name||"現場名未設定";
  document.getElementById("today-date").textContent=`${y}年${m+1}月${d}日（${jpDay(y,m,d)}）`;

  // Today's event
  const evs=eventsOnDate(s,dk);
  document.getElementById("today-event").innerHTML=evs.length>0
    ?evs.map(e=>`<div style="background:${e.color};color:#fff;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;margin-top:4px">${escHtml(e.title)}</div>`).join("")
    :"";

  // Summary
  let nk=0,cnt=0;
  workers.forEach(w=>{const st=log.workerStatus?.[w.id]||"";if(st==="present"){nk+=1;cnt++}else if(st==="half"){nk+=0.5;cnt++}});
  const planH=log.plannedHeadcount||0;
  document.getElementById("today-summary").innerHTML=`
    <div style="text-align:center"><div class="num">${nk}</div><div class="lbl">人工</div></div>
    <div style="text-align:center"><div class="num" style="color:#059669">${cnt}</div><div class="lbl">出勤</div></div>
    ${planH>0?`<div style="text-align:center"><div class="num" style="color:#2563EB">${planH}</div><div class="lbl">予定</div></div>`:""}
  `;

  // Member cards
  let cardsHTML="";
  workers.forEach(w=>{
    const st=log.workerStatus?.[w.id]||"";
    cardsHTML+=`<div class="m-card" data-st="${st}" onclick="toggleTodayStatus('${w.id}')">
      <div class="avatar" style="background:${w.color}">${workerIcon(w)}</div>
      <div class="name">${w.name}</div>
      <div class="status">${STATUS_LABEL[st]}</div>
    </div>`;
  });
  // Add member card
  cardsHTML+=`<div class="m-card" data-st="" onclick="showWorkerModal()" style="border-style:dashed;align-items:center;justify-content:center">
    <svg width="24" height="24" fill="none" stroke="#94A3B8" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <div class="name" style="color:#94A3B8">追加</div>
  </div>`;
  document.getElementById("today-members").innerHTML=cardsHTML;

  // Actions
  const hasAny=workers.some(w=>{const st=log.workerStatus?.[w.id]||"";return st==="present"||st==="half"||st==="absent"});
  let actHTML="";
  if(!hasAny&&workers.length>0){
    actHTML+=`<button class="btn btn-outline" style="width:100%" onclick="copyYesterday()">昨日と同じメンバーで出勤</button>`;
  }
  document.getElementById("today-actions").innerHTML=actHTML;

  // Memo
  const memo=log.memo||"";
  document.getElementById("today-memo").innerHTML=`
    <div class="label">作業メモ</div>
    <textarea class="field" placeholder="今日の作業内容..." oninput="saveTodayMemo(this.value)">${escHtml(memo)}</textarea>`;
}

function toggleTodayStatus(wId){
  const dk=todayKey();
  updateSite(s=>{
    if(!s.dayLogs[dk])s.dayLogs[dk]={};
    if(!s.dayLogs[dk].workerStatus)s.dayLogs[dk].workerStatus={};
    const cur=s.dayLogs[dk].workerStatus[wId]||"";
    const next=STATUS_CYCLE[(STATUS_CYCLE.indexOf(cur)+1)%STATUS_CYCLE.length];
    s.dayLogs[dk].workerStatus[wId]=next;
  });
  renderToday();
}

function copyYesterday(){
  const now=new Date();
  let prev=new Date(now);
  // Find last workday
  do{prev.setDate(prev.getDate()-1)}while(prev.getDay()===0||prev.getDay()===6);
  const pk=dkey(prev.getFullYear(),prev.getMonth(),prev.getDate());
  const s=getSite();if(!s)return;
  const prevLog=s.dayLogs?.[pk];
  if(!prevLog?.workerStatus){alert("昨日のデータがありません");return}
  const dk=todayKey();
  updateSite(s=>{
    if(!s.dayLogs[dk])s.dayLogs[dk]={};
    s.dayLogs[dk].workerStatus={...prevLog.workerStatus};
  });
  renderToday();
}

function saveTodayMemo(val){
  const dk=todayKey();
  updateSite(s=>{if(!s.dayLogs[dk])s.dayLogs[dk]={};s.dayLogs[dk].memo=val});
}

// ─── CALENDAR SCREEN ─────────────────────────────────────────
function calPrev(){if(calMonth===0){calYear--;calMonth=11}else calMonth--;renderCalendar()}
function calNext(){if(calMonth===11){calYear++;calMonth=0}else calMonth++;renderCalendar()}
function goCalToday(){const n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();renderCalendar()}

function renderCalendar(){
  const s=getSite();if(!s)return;
  document.getElementById("cal-title").textContent=s.name||"カレンダー";
  document.getElementById("cal-month").textContent=`${calYear}年 ${calMonth+1}月`;
  const dim=daysInMonth(calYear,calMonth);
  let total=0;for(let d=1;d<=dim;d++){const log=s.dayLogs?.[dkey(calYear,calMonth,d)]||{};if(log.workerStatus)Object.values(log.workerStatus).forEach(st=>{if(st==="present")total+=1;else if(st==="half")total+=.5})}
  document.getElementById("cal-sub").textContent=`合計 ${total} 人工`;
  renderCalGrid();
  renderEventList();
}

function renderCalGrid(){
  const s=getSite();if(!s)return;
  const dim=daysInMonth(calYear,calMonth),fd=firstDow(calYear,calMonth),today=new Date();
  const events=(s.events||[]).sort((a,b)=>a.start.localeCompare(b.start)||(b.end.localeCompare(a.end)));
  const weeks=[];let wk=[];
  for(let i=0;i<fd;i++)wk.push(null);
  for(let d=1;d<=dim;d++){wk.push({day:d,ds:dkey(calYear,calMonth,d)});if(wk.length===7){weeks.push(wk);wk=[]}}
  if(wk.length>0){while(wk.length<7)wk.push(null);weeks.push(wk)}

  let html="";
  for(const week of weeks){
    let nums="";
    for(let c=0;c<7;c++){
      const cell=week[c];
      if(!cell){nums+=`<div class="day-c"></div>`;continue}
      const d=cell.day,dow=new Date(calYear,calMonth,d).getDay();
      const isT=d===today.getDate()&&calMonth===today.getMonth()&&calYear===today.getFullYear();
      const dcl=dow===0?" sun":dow===6?" sat":"";
      const tcl=isT?" today":"";
      const log=s.dayLogs?.[cell.ds]||{};
      const planH=Math.max(log.plannedHeadcount||0,(log.planWorkers?Object.values(log.planWorkers).filter(v=>v==="planned").length:0));
      let actH=0;if(log.workerStatus)Object.values(log.workerStatus).forEach(st=>{if(st==="present"||st==="half")actH++});
      const hasMemo=!!log.memo;
      let ind="";
      const parts=[];
      if(actH>0)parts.push(`<span class="an">${actH}</span>`);
      else if(planH>0)parts.push(`<span class="pn">${planH}</span>`);
      if(hasMemo)parts.push(`<span class="dot" style="background:#D97706"></span>`);
      if(parts.length)ind=`<div class="ind">${parts.join("")}</div>`;
      nums+=`<div class="day-c" onclick="openDayFromCal(${d})"><span class="dn${tcl}${dcl}">${d}</span>${ind}</div>`;
    }
    // Event bars
    const wStart=week.find(c=>c)?.ds||"",wEnd=week.filter(c=>c).pop()?.ds||"";
    const wEvs=events.filter(e=>e.start<=wEnd&&e.end>=wStart);
    const rows=[];const rowEnds=[];
    for(const ev of wEvs){
      let sc=-1,ec=-1;
      for(let c=0;c<7;c++){if(!week[c])continue;if(week[c].ds>=ev.start&&week[c].ds<=ev.end){if(sc===-1)sc=c;ec=c}}
      if(sc===-1)continue;
      let r=0;while(r<3&&rowEnds[r]!==undefined&&rowEnds[r]>=sc)r++;
      if(r>=3)continue;
      rowEnds[r]=ec;
      if(!rows[r])rows[r]=[];
      rows[r].push({ev,sc,ec});
    }
    let bars="";
    for(let r=0;r<rows.length;r++){
      if(!rows[r])continue;
      let rh="";
      for(const p of rows[r]){
        const sp=p.ec-p.sc+1;
        const cl=p.ev.start<(week[p.sc]?.ds||"")&&p.sc>0;
        const cr=p.ev.end>(week[p.ec]?.ds||"")&&p.ec<6;
        rh+=`<div class="ev-bar${cl?" cl":""}${cr?" cr":""}" style="grid-column:${p.sc+1}/span ${sp};background:${p.ev.color}" onclick="event.stopPropagation();showEventModal('${p.ev.id}')">${escHtml(p.ev.title)}</div>`;
      }
      bars+=`<div class="bar-row">${rh}</div>`;
    }
    html+=`<div class="week-row"><div class="week-nums">${nums}</div><div class="week-bars">${bars}</div></div>`;
  }
  document.getElementById("cal-grid").innerHTML=html;
}

function renderEventList(){
  const s=getSite();if(!s)return;
  const evs=(s.events||[]).filter(e=>{const ms=dkey(calYear,calMonth,1),me=dkey(calYear,calMonth,daysInMonth(calYear,calMonth));return e.start<=me&&e.end>=ms}).sort((a,b)=>a.start.localeCompare(b.start));
  const el=document.getElementById("cal-event-list");
  if(!evs.length){el.innerHTML=`<div style="padding:16px;text-align:center;color:#94A3B8;font-size:13px">工程がありません</div>`;return}
  el.innerHTML=evs.map(e=>{
    const sd=parseInt(e.start.split("-")[2]),ed=parseInt(e.end.split("-")[2]);
    return`<div onclick="showEventModal('${e.id}')" style="display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #F0F2F8;cursor:pointer">
      <div style="width:4px;height:28px;border-radius:2px;background:${e.color}"></div>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">${escHtml(e.title)}</div><div style="font-size:12px;color:#94A3B8;margin-top:2px">${sd}日〜${ed}日</div></div>
    </div>`}).join("");
}

  switchTab("today");

  renderEmColors();
  document.getElementById("event-modal").classList.remove("hidden");
}
function hideEventModal(){document.getElementById("event-modal").classList.add("hidden");editingEventId=null}
function renderEmColors(){
  document.getElementById("em-colors").innerHTML=EVENT_COLORS.map(c=>{
    const sel=c===selectedEventColor;
    return`<button class="color-dot" onclick="selectedEventColor='${c}';renderEmColors()" style="background:${c};box-shadow:${sel?`0 0 0 3px #fff,0 0 0 5px ${c}`:`none`};transform:${sel?"scale(1.1)":"scale(1)"}">
      ${sel?`<svg width="16" height="16" fill="none" stroke="#fff" stroke-width="3" viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12"/></svg>`:""}</button>`}).join("");
}
function saveEventFromModal(){
  const title=document.getElementById("em-name").value.trim();
  const start=document.getElementById("em-start").value;
  const end=document.getElementById("em-end").value;
  if(!title||!start||!end)return;
  if(end<start){alert("終了日は開始日以降にしてください");return}
  updateSite(s=>{
    if(!s.events)s.events=[];
    if(editingEventId){const e=s.events.find(e=>e.id===editingEventId);if(e){e.title=title;e.start=start;e.end=end;e.color=selectedEventColor}}
    else s.events.push({id:uid(),title,start,end,color:selectedEventColor});
  });
  hideEventModal();renderCalendar();
}
function deleteEventFromModal(){
  if(!confirm("この工程を削除しますか？"))return;
  updateSite(s=>{s.events=(s.events||[]).filter(e=>e.id!==editingEventId)});
  hideEventModal();renderCalendar();
}

// ─── PDF EXPORT ──────────────────────────────────────────────
function exportPDF(){
  const s=getSite();if(!s)return;
  const sw=sortedWorkers(s),days=daysInMonth(calYear,calMonth);
  const activeWorkers=sw.filter(w=>{for(let d=1;d<=days;d++){const st=s.dayLogs?.[dkey(calYear,calMonth,d)]?.workerStatus?.[w.id]||"";if(st==="present"||st==="half")return true}return false});
  const wTotals=activeWorkers.map(w=>{let n=0;for(let i=1;i<=days;i++){const st=s.dayLogs?.[dkey(calYear,calMonth,i)]?.workerStatus?.[w.id]||"";if(st==="present")n+=1;else if(st==="half")n+=.5}return n});
  const gt=wTotals.reduce((a,b)=>a+b,0);
  const wH=activeWorkers.map(w=>`<th class="wn" style="background:${w.color}">${escHtml(w.name)}</th>`).join("");
  let rows="";
  for(let d=1;d<=days;d++){const k=dkey(calYear,calMonth,d),log=s.dayLogs?.[k]||{},wd=jpDay(calYear,calMonth,d),dow=new Date(calYear,calMonth,d).getDay();const bg=dow===0?"#FEF2F2":dow===6?"#EFF6FF":"#fff";const dc=dow===0?"#DC2626":dow===6?"#2563EB":"#334155";let nk=0;const wC=activeWorkers.map(w=>{const st=log.workerStatus?.[w.id]||"";if(st==="present"){nk+=1;return`<td class="s">○</td>`}if(st==="half"){nk+=.5;return`<td class="s h">△</td>`}return`<td class="s n"></td>`}).join("");rows+=`<tr style="background:${bg}"><td class="d">${d}</td><td class="w" style="color:${dc}">${wd}</td>${wC}<td class="nk">${nk>0?nk:""}</td><td class="m">${escHtml(log.memo||"")}</td></tr>`}
  const wF=wTotals.map((t,i)=>`<td class="s" style="font-weight:800;font-size:7.5px;color:#1E293B;background:${activeWorkers[i].color}12">${t}</td>`).join("");
  const sR=activeWorkers.map((w,i)=>{let p=0,h=0;for(let d=1;d<=days;d++){const st=s.dayLogs?.[dkey(calYear,calMonth,d)]?.workerStatus?.[w.id]||"";if(st==="present")p++;else if(st==="half")h++}return`<tr><td class="nm"><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:${w.color};margin-right:3px;vertical-align:middle"></span>${escHtml(w.name)}</td><td class="ct">${p}</td><td class="ct">${h}</td><td class="tt">${wTotals[i]}</td></tr>`}).join("");
  const gc=s.generalContractor||"",gcm=s.gcManager||"";
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escHtml(s.name||"現場")} ${calYear}年${calMonth+1}月 出面表</title><style>@page{size:A4 landscape;margin:8mm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Hiragino Sans","Meiryo",sans-serif;color:#1E293B;font-size:8px;width:281mm}h1{font-size:14px;font-weight:800;margin:0 0 1px}.period{font-size:10px;color:#475569;font-weight:700}.info-row{display:table;width:100%;margin:4px 0 6px;padding:3px 0;border-top:2px solid #1E293B;border-bottom:1px solid #CBD5E1;font-size:8px}.info-row span{margin-right:14px}.info-row b{color:#94A3B8;font-weight:600;font-size:7px;margin-right:3px}.cols{display:table;width:100%;table-layout:fixed}.col-main{display:table-cell;vertical-align:top;padding-right:8px}.col-side{display:table-cell;vertical-align:top;width:130px}table.att{width:100%;border-collapse:collapse;font-size:7.5px}table.att th,table.att td{border:1px solid #CBD5E1;padding:1.5px 2px}table.att thead th{background:#1E293B;color:#fff;font-weight:600;text-align:center;font-size:7px;white-space:nowrap}table.att thead th.wn{writing-mode:vertical-rl;text-orientation:mixed;padding:4px 1px;font-size:7.5px;letter-spacing:.5px;min-width:18px}table.att td.d{text-align:center;font-weight:700;width:16px}table.att td.w{text-align:center;font-weight:700;width:14px}table.att td.s{text-align:center;font-size:10px;font-weight:700;color:#059669;width:20px;padding:0}table.att td.s.h{color:#D97706}table.att td.s.n{color:#E5E7EB;font-size:7px}table.att td.nk{text-align:center;font-weight:800;width:20px;color:#4338CA;font-size:8px}table.att td.m{font-size:6.5px;color:#64748B;padding:1px 3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:60px}table.att tfoot td{background:#F1F5F9;font-weight:800;text-align:center}.sum-card{border:1.5px solid #CBD5E1;border-radius:4px;padding:8px 6px;text-align:center;margin-bottom:6px}.sum-card .big{font-size:26px;font-weight:900;color:#4338CA;line-height:1}.sum-card .lbl{font-size:7px;color:#94A3B8;font-weight:700;margin-top:2px}table.stbl{width:100%;border-collapse:collapse;font-size:7.5px}table.stbl th{background:#F1F5F9;padding:2px 3px;border:1px solid #E2E8F0;font-weight:700;text-align:center;color:#64748B;font-size:6.5px}table.stbl td{padding:2px 3px;border:1px solid #E2E8F0}table.stbl td.nm{white-space:nowrap}table.stbl td.ct{text-align:center;font-weight:700}table.stbl td.tt{text-align:center;font-weight:900;color:#4338CA}.foot{font-size:7px;color:#94A3B8;margin-top:4px;padding-top:2px;border-top:1px solid #E2E8F0;overflow:hidden}.foot span{float:left}.foot span:last-child{float:right}</style></head><body><h1>${escHtml(s.name||"現場")}</h1><span class="period">${calYear}年${calMonth+1}月 出面表</span><div class="info-row"><span><b>現場名</b>${escHtml(s.name||"—")}</span><span><b>元請会社</b>${escHtml(gc||"—")}</span><span><b>元請担当</b>${escHtml(gcm||"—")}</span><span><b>TEL</b>${escHtml(s.phone||"—")}</span><span><b>住所</b>${escHtml(s.address||"—")}</span></div><div class="cols"><div class="col-main"><table class="att"><thead><tr><th>日</th><th>曜</th>${wH}<th style="width:20px">人工</th><th style="width:60px">メモ</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="2" style="font-size:7px">合計</td>${wF}<td style="font-weight:900;color:#4338CA;font-size:8px">${gt}</td><td></td></tr></tfoot></table></div><div class="col-side"><div class="sum-card"><div class="big">${gt}</div><div class="lbl">月間合計人工</div></div><table class="stbl"><thead><tr><th>氏名</th><th style="width:22px">出勤</th><th style="width:22px">半日</th><th style="width:26px">人工</th></tr></thead><tbody>${sR}</tbody></table></div></div><div class="foot"><span>○ 出勤（1人工）／ △ 半日（0.5人工）</span><span>出力日: ${new Date().toLocaleDateString("ja-JP")}　彩心堂</span></div></body></html>`;
  const win=window.open("","_blank");if(!win){alert("ポップアップを許可してください");return}
  win.document.open();win.document.write(html);win.document.close();
  win.onload=()=>{setTimeout(()=>win.print(),200)};
}
